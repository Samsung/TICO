model:
  family: qwen3_vl
  name_or_path: Qwen/Qwen3-VL-4B-Instruct
  trust_remote_code: true
  hf_token: null
  cache_dir: null

runtime:
  device: cuda
  dtype: float32
  seed: 42
  show_progress: true

calibration:
  datasets:
    - dataset: vqav2
      split: testdev
      n_samples: 128
    - dataset: wikitext2
      split: train
      n_samples: 128
  seq_len: 2048

model_args:
  vision:
    grid_thw: [8, 24, 24]
    visual_start_idx: 0
    spatial_merge_size: 2

pipeline:
  - name: spinquant
    enabled: true
    init_method: random
    r1_path: null
    r2_map_path: null
    enable_r1: true
    enable_r2: true
    fuse_deepstack_visual_outputs: true
    vision_init_method: random
    vision_r1_path: null
    vision_r2_map_path: null
    enable_vision_r1: true
    enable_vision_r2: true
    fuse_vision_layer_norms: true
    require_vision_r1_layernorm_compatible: true
    vision_rotation_tolerance: 1.0e-4

  - name: smoothquant
    enabled: false
    alpha: 0.5
    components: both
    custom_alpha_map: null

  - name: gptq
    enabled: true
    weight_bits: 4
    weight_bits_overrides: {}
    perchannel: true
    symmetric: false
    mse: null
    sensitivity:
      mode: compute
      path: null
    percdamp: 0.01
    groupsize: -1
    actorder: true
    static_groups: false
    verbose: false
    show_progress: true
    quantize_vision: true
    quantize_text: true
    quantize_lm_head: false
    quantize_vision_patch_embed: true
    quantize_vision_blocks: true
    quantize_vision_merger: true
    quantize_vision_deepstack_mergers: true
    quantize_text_layers: true
    move_cache_to_cpu: false

  - name: ptq
    enabled: true
    activation: int16
    linear_weight: uint4
    vision_patch_embed_weight: uint8
    embedding_weight: uint8
    lm_head_weight: uint8
    spin_rotation_weight: int16
    norm: int16
    norm_weight: int16
    strict_wrap: true

  - name: weight_sparsity
    enabled: true
    output_dir: ./out/qwen3_vl_4b_weight_sparsity
    filename_stem: weight_sparsity
    layer_filename_stem: weight_sparsity_by_layer
    formats: [csv, markdown]
    precision: 6
    include_layer_report: true
    include_layer_totals: true
    print_layer_report: false
    max_chunk_elements: 4194304
    deduplicate_shared_weights: true
    include_empty_scopes: false

evaluation:
  enabled: false
  vlm_tasks: []
  coco: false
  llava_bench: false
  n_samples: 50
  max_seq_len: 2048

export:
  enabled: false
  output_dir: ./out/qwen3_vl_4b_weight_sparsity
  artifacts: []
