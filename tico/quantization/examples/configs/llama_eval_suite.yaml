model:
  family: llama
  name_or_path: Maykeye/TinyLLama-v0
  trust_remote_code: false
  hf_token: null
  cache_dir: null

runtime:
  device: cuda
  dtype: float32
  seed: 42
  show_progress: true

model_args:
  profile: reference_eval

calibration:
  dataset: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  split: train
  n_samples: 128
  seq_len: 2048
  decode_steps: 8

pipeline: []

evaluation:
  enabled: true
  backend: eager
  output_dir: ./out/llama_eval_suite/evaluation
  use_cache: true
  perplexity: null
  lm_eval_tasks: mmlu,hellaswag,piqa,truthfulqa_mc1,truthfulqa_mc2,race,triviaqa
  max_seq_len: null  # Use the original model context; independent of calibration.

export:
  enabled: false
  output_dir: ./out/llama_eval
  max_seq_len: 2048
  prefill_decode: true
  artifacts:
    - ptq_checkpoint
