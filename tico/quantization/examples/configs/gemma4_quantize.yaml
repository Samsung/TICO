# Quantize Gemma4 E2B with PTQ and save the resulting checkpoint.
model:
  family: gemma4
  name_or_path: google/gemma-4-e2b-it
  trust_remote_code: true
  hf_token: null
  cache_dir: null

runtime:
  device: cuda
  dtype: float32
  seed: 42
  show_progress: true

calibration:
  datasets:
    - dataset: vqav2
      split: train
      n_samples: 128
    - dataset: wikitext2
      split: train
      n_samples: 128
  seq_len: 2048

model_args:
  vision:
    profile: e2b_66x36_264
    validate_static_layout: false


pipeline:
  - name: gptq
    enabled: true
    weight_bits: 4
    
  - name: ptq
    enabled: true
    activation: int16
    weight: int16
    linear_weight: uint4
    embedding_weight: uint8
    lm_head_weight: uint8
    vision_patch_embed_weight: uint8
    norm_weight: int16
    strict_wrap: true

evaluation:
  enabled: false
  llava_bench:
    enabled: false
  n_samples: 50
  max_seq_len: 2048

export:
  enabled: true
  output_dir: ./out/gemma4_quantized
  artifacts:
    - ptq_checkpoint
