model:
  family: gemma4
  name_or_path: google/gemma-4-e2b-it
  trust_remote_code: true
  hf_token: null
  cache_dir: null

runtime:
  device: cuda
  dtype: float32
  seed: 42
  show_progress: true

calibration:
  datasets:
    - dataset: vqav2
      split: testdev
      n_samples: 128
  seq_len: 2048

model_args:
  vision:
    visual_start_idx: 0
    num_visual_tokens: 256
    image_height: 896
    image_width: 896
    validate_static_layout: false

pipeline:
  - name: gptq
    enabled: true
    weight_bits: 4

  - name: ptq
    enabled: true
    print_model: false
    activation: int16
    linear_weight: uint4
    vision_patch_embed_weight: uint8
    embedding_weight: uint8
    lm_head_weight: uint8    
    norm: int16
    norm_weight: int16
    strict_wrap: true

evaluation:
  enabled: false
  vlm_tasks: []
  coco: false
  llava_bench:
    enabled: false
  videomme:
    enabled: false
  mmlu:
    enabled: false
  hellaswag:
    enabled: false
  mmmu:
    enabled: false
  ppl:
    enabled: false
  n_samples: -1
  max_seq_len: 2048
export:
  enabled: false
  output_dir: ./out/gemma4_e2b_gptq
  artifacts:
    - ptq_checkpoint
