model:
  family: qwen3_vl
  name_or_path: Qwen/Qwen3-VL-4B-Instruct
  trust_remote_code: true
  hf_token: null
  cache_dir: null

runtime:
  device: cuda
  dtype: float32
  seed: 42
  show_progress: true

calibration:
  datasets:
    - dataset: vqav2
      split: train
      n_samples: 128
    - dataset: wikitext2
      split: train
      n_samples: 128
  seq_len: 2048

model_args:
  vision:
    grid_thw: [8, 24, 24]
    visual_start_idx: 0
    spatial_merge_size: 2

pipeline:
  - name: gptq
    enabled: true
    variant: universal
    weight_bits: 4
    weight_bits_overrides:
      model.visual.patch_embed.proj: 8
    verbose: true
    show_progress: true
    debug_mode: true
    ignore_multi_call_modules: true
    cacheable_modules: ["model.visual.blocks.[0-9]+", "model.language_model.layers.[0-9]+"]

  - name: ptq
    enabled: true
    reuse_gptq_qparams: true
    activation: int16
    linear_weight: uint4
    vision_patch_embed_weight: uint8
    embedding_weight: uint8
    lm_head_weight: uint8
    spin_rotation_weight: int16
    norm: int16
    norm_weight: int16
    strict_wrap: true
