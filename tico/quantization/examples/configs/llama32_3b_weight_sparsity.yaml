model:
  family: llama
  name_or_path: meta-llama/Llama-3.2-3B-Instruct
  trust_remote_code: false
  hf_token: null
  cache_dir: null

runtime:
  device: cuda
  dtype: float32
  seed: 42
  show_progress: true

model_args:
  profile: npu_export

calibration:
  dataset: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  split: train
  n_samples: 128
  seq_len: 2048
  decode_steps: 8

pipeline:
  - name: spinquant
    enabled: true

  - name: cle
    enabled: false
    pairs:
      - model.layers.*.mlp.up_proj:model.layers.*.mlp.down_proj
    method: absmax
    max_iter: 1

  - name: gptq
    enabled: true
    weight_bits: 4
    weight_bits_overrides: {}
    perchannel: true
    symmetric: false
    mse: mse
    sensitivity:
      mode: compute
      path: null
    percdamp: 0.01
    groupsize: -1
    actorder: true
    static_groups: false
    quantize_lm_head: false
    use_orig_model_inference: false
    verbose: false
    show_progress: true

  - name: ptq
    enabled: true
    profile: npu_export
    activation: int16
    linear_weight: uint4
    embedding_weight: uint8
    lm_head_weight: uint8
    spin_rotation_weight: int16
    norm_weight: int16
    strict_wrap: true
    decode_calibration_steps: 8

  - name: weight_sparsity
    enabled: true
    output_dir: ./out/llama32_3b_weight_sparsity
    filename_stem: weight_sparsity
    layer_filename_stem: weight_sparsity_by_layer
    formats: [csv, markdown]
    precision: 6
    include_layer_report: true
    include_layer_totals: true
    print_layer_report: false
    max_chunk_elements: 4194304
    deduplicate_shared_weights: true
    include_empty_scopes: false

evaluation:
  enabled: false
  perplexity: null
  lm_eval_tasks: null
  max_seq_len: 2048

export:
  enabled: false
  output_dir: ./out/llama32_3b_weight_sparsity
  max_seq_len: 2048
  prefill_decode: false
  artifacts: []
