# Export a Gemma4 E4B model or saved checkpoint without running quantization stages.
model:
  family: gemma4
  name_or_path: google/gemma-4-E4B-it
  trust_remote_code: true
  hf_token: null
  cache_dir: null

runtime:
  device: cpu
  dtype: float32
  seed: 42
  show_progress: true

calibration:
  seq_len: 2048

model_args:
  vision:
    profile: gemma4_66x36_264
    validate_static_layout: false


pipeline: []

evaluation:
  enabled: false
  max_seq_len: 2048

export:
  enabled: true
  output_dir: ./out/gemma4_e4b_quantized/circle_layers
  max_seq_len: 2048
  prefill_decode: true
  decode_kv_policy: compact_sliding_v1  # full_capacity_v1 preserves the legacy Q=1 ABI.
  ple_prefill_split: false  # Requires .pt lookup and last-token-only runtime prefill.
  strict: false
  vision:
    granularity: both  # monolithic | encoder | layer | both
    # Use 'encoder' to export all encoder layers as a single graph,
    # with the patch embedder, pooler, and post projection exported separately.
  artifacts:
    - circle_per_layer
