# Evaluate a floating-point Gemma4 E2B model or a saved checkpoint.
model:
  family: gemma4
  name_or_path: google/gemma-4-e2b-it
  trust_remote_code: true
  hf_token: null
  cache_dir: null

runtime:
  device: cuda
  dtype: float32
  seed: 42
  show_progress: true

calibration:
  seq_len: 2048

model_args:
  vision:
    visual_start_idx: 0
    num_visual_tokens: 256
    image_height: 896
    image_width: 896
    validate_static_layout: false

pipeline: []

evaluation:
  enabled: true
  vlm_tasks:
    - vqav2
  coco: true
  llava_bench:
    enabled: true
    mode: judge
    dataset: lmms-lab/llava-bench-in-the-wild
    split: train
    n_samples: 50
    start_index: 0
    max_seq_len: 2048
    max_new_tokens: 512
    temperature: 0.0
    image_max_pixels: null
    image_min_pixels: null
    resized_height: 896
    resized_width: 896
    visual_token_margin: 256
    candidate_label: gemma4_e2b
    baseline_label: reference
    candidate_answers: null
    baseline_answers: null
    regenerate: false
    output:
      dir: ./out/gemma4_eval_suite/llava_bench
      answers: ./out/gemma4_eval_suite/llava_bench/gemma4_e2b.answers.jsonl
      reviews: ./out/gemma4_eval_suite/llava_bench/gemma4_e2b.llama3_2_3b.reviews.jsonl
      summary: ./out/gemma4_eval_suite/llava_bench/gemma4_e2b.llama3_2_3b.summary.json
    judge:
      enabled: true
      model_id: unsloth/Llama-3.2-3B-Instruct
      device: cuda
      dtype: float16
      max_new_tokens: 256
      temperature: 0.0
      swap_order: true
  videomme:
    enabled: true
    batch_size: 1
    max_new_tokens: 30
    n_samples: 1000
    max_num_frames: 32
    use_cache: null
    verbose: true
  mmlu:
    enabled: true
    subjects: null
    n_shots: 5
    n_samples: -1
    batch_size: 1
  hellaswag:
    enabled: true
    n_shots: 10
    n_samples: 1000
    batch_size: 1
  mmmu:
    enabled: true
    dataset: MMMU/MMMU_Pro
    subjects:
      - vision
    n_shots: 5
    n_samples: 1000
    max_new_tokens: 16
    temperature: 0.0
    verbose: false
  ppl:
    enabled: true
    dataset: wikitext2
    split: test
    stride: 512
  n_samples: 1000
  max_seq_len: 2048

export:
  enabled: false
  output_dir: ./out/gemma4_eval_suite
  artifacts: []
