name: Setup TICO test environment
description: Install a selected PyTorch channel, TICO, and test dependencies

inputs:
  torch-version:
    description: PyTorch family, nightly, or nightly-latest
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Assert that no external Circle runtime is installed
      shell: bash
      run: |
        # The default test suite executes Circle models with TICO's built-in
        # reference runtime. Fail early if ONE or onert are present so that the
        # suite cannot depend on them by accident.
        if command -v onecc >/dev/null 2>&1 || [ -e /usr/share/one ]; then
          echo "::error::ONE (one-compiler) must not be installed in the test environment"
          exit 1
        fi
        if python3 -c "import onert" >/dev/null 2>&1; then
          echo "::error::The onert package must not be installed in the test environment"
          exit 1
        fi

    - name: Trust the checkout for versioningit
      shell: bash
      run: git config --global --add safe.directory '*'

    - name: Install TICO and configure tests
      shell: bash
      env:
        TORCH_VERSION: ${{ inputs.torch-version }}
      run: |
        ./ccex install --dist --torch_ver "$TORCH_VERSION" --cpu_only
        pt2-to-circle -h
        ./ccex configure test --torch_ver "$TORCH_VERSION" --cpu_only

    - name: Show installed package versions
      shell: bash
      run: |
        python3 - <<'PY'
        import torch
        import torchvision
        import tico

        print(f"torch={torch.__version__}")
        print(f"torchvision={torchvision.__version__}")
        print(f"tico={tico.__version__}")
        PY
