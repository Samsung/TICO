name: Check PR

on:
  pull_request:
    branches:
      - main
      - rel/*

permissions:
  contents: read

concurrency:
  group: check-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-commit-message:
    name: Check commit message
    runs-on: ubuntu-24.04
    # Skip on draft, check on draft -> ready
    if: github.repository_owner == 'Samsung' && github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout PR head commit. The default is the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check signed-off
        run: |
          git log origin/"$GITHUB_BASE_REF"..HEAD --format=%b > commit_msg.txt
          sed "/^$/d" commit_msg.txt > commit_body.txt

          count="$(grep -c "TICO-DCO-1.0-Signed-off-by:" commit_body.txt)"
          if [[ ! "$count" -ge "1" ]]; then
            echo "Your commit message does not contain the expected signoff information."
            echo "Please add a line like 'TICO-DCO-1.0-Signed-off-by: <NAME> <<EMAIL>>' to your commit message."
            echo "Refer to https://github.com/Samsung/TICO/wiki/TICO-Developer-Certificate-of-Origin"
            exit 1
          fi

          echo "TICO-DCO-1.0-Signed-off-by is OK"

  check-style:
    name: Check style
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run configure
        run: ./ccex configure format

      - name: Run linters
        run: ./ccex format --no-apply-patches

  resolve_torch_policy:
    name: Resolve PyTorch policy
    runs-on: ubuntu-24.04
    outputs:
      default_family: ${{ steps.policy.outputs.default_family }}
      pr_smoke_matrix: ${{ steps.policy.outputs.pr_smoke_matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Read central policy
        id: policy
        run: |
          POLICY=tico/utils/compat/torch_version_policy.py
          python3 "$POLICY" validate
          echo "default_family=$(python3 "$POLICY" default-family)" >> "$GITHUB_OUTPUT"
          echo "pr_smoke_matrix=$(python3 "$POLICY" ci-matrix pr-smoke)" >> "$GITHUB_OUTPUT"

  build_package:
    name: Build package once
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel
        run: ./ccex build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: tico-wheel
          path: ./dist/
          retention-days: 1

  test_default:
    name: Full test (default torch ${{ needs.resolve_torch_policy.outputs.default_family }})
    needs:
      - resolve_torch_policy
      - build_package
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: tico-wheel
          path: ./dist/

      - name: Set up test environment
        uses: ./.github/actions/setup-tico-test
        with:
          torch-version: ${{ needs.resolve_torch_policy.outputs.default_family }}

      - name: Run all tests
        run: ./ccex test

  test_compatibility:
    name: Smoke (${{ matrix.tier }}, torch ${{ matrix.torch-version }})
    needs:
      - resolve_torch_policy
      - build_package
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_torch_policy.outputs.pr_smoke_matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: tico-wheel
          path: ./dist/

      - name: Set up test environment
        uses: ./.github/actions/setup-tico-test
        with:
          torch-version: ${{ matrix.torch-version }}

      - name: Run export and quantization smoke tests
        run: |
          ./ccex test -k SimpleAdd
          python3 -m unittest \
            test.quantization.wrapq.test_cnn_quantized_export.CNNQuantizedExportTest.test_uint8_circle_export \
            -v
